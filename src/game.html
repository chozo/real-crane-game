<style>
  :root { --ink:#1d1a14; --cream:#fff8e6; --yel:#ffcc1a; --red:#e8452c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#0d1218; overflow:hidden; touch-action:none;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Yu Gothic", Meiryo, sans-serif; }
  #app { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); overflow:hidden; background:#9cc6e6; user-select:none; -webkit-user-select:none; }
  #stage { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #ui { position:absolute; inset:0; pointer-events:none; color:var(--cream); }
  #ui button { pointer-events:auto; font-family:inherit; cursor:pointer; touch-action:none; }
  .panel { position:absolute; left:0; right:0; display:none; }
  .show { display:block; }
  .nw { display:inline-block; white-space:nowrap; }

  /* 上部 HUD */
  #hud { top:0; padding:calc(var(--u)*2.4) calc(var(--u)*3) calc(var(--u)*3); background:linear-gradient(180deg,rgba(10,14,20,.62),rgba(10,14,20,.38) 70%,rgba(10,14,20,0)); }
  .hrow { display:flex; justify-content:space-between; align-items:center; gap:calc(var(--u)*2); }
  .chip { background:rgba(16,20,26,.72); border-radius:calc(var(--u)*2.4); padding:calc(var(--u)*1.2) calc(var(--u)*2.6); font-weight:800;
    font-size:calc(var(--u)*4.2); line-height:1.2; white-space:nowrap; box-shadow:0 3px 10px rgba(0,0,0,.3); }
  .chip b { color:var(--yel); font-variant-numeric:tabular-nums; }
  #hPrize { margin-top:calc(var(--u)*1.6); display:flex; align-items:center; gap:calc(var(--u)*2); }
  #hPrize .name { font-size:calc(var(--u)*5.4); font-weight:900; text-shadow:0 2px 0 #000, 0 0 10px rgba(0,0,0,.7); white-space:nowrap; }
  #hPrize .val { font-size:calc(var(--u)*4); font-weight:800; color:var(--ink); background:var(--yel); border-radius:99px; padding:calc(var(--u)*.5) calc(var(--u)*2.2); white-space:nowrap; }
  #hTries { margin-left:auto; font-size:calc(var(--u)*3.8); font-weight:800; white-space:nowrap; text-shadow:0 2px 4px #000; }
  #hTries .x { color:#ff5a3c; } #hTries .o { opacity:.5; }
  #hCond { margin-top:calc(var(--u)*1); font-size:calc(var(--u)*3.7); font-weight:800; text-shadow:0 2px 4px #000; min-height:1.3em; white-space:nowrap; }
  #hCond .bad { color:#ffb02e; }

  /* 傾き・揺れゲージ */
  #gauges { bottom:calc(var(--u)*57); padding:0 calc(var(--u)*4); }
  .g { display:flex; align-items:center; gap:calc(var(--u)*2); margin-top:calc(var(--u)*1.4); }
  .g span { width:calc(var(--u)*11); font-size:calc(var(--u)*3.8); font-weight:800; text-shadow:0 2px 4px #000; white-space:nowrap; }
  .g .bar { position:relative; flex:1; height:calc(var(--u)*3.2); border-radius:99px; background:rgba(10,14,20,.6); box-shadow:inset 0 1px 3px rgba(0,0,0,.6); overflow:hidden; }
  .g .fill { position:absolute; left:0; top:0; bottom:0; width:0; border-radius:99px; background:linear-gradient(90deg,#7be36b,#ffd23a 60%,#ff5a3a); }
  .g .mk { position:absolute; top:-10%; bottom:-10%; width:calc(var(--u)*.7); background:#fff; opacity:.95; }
  .g em { width:calc(var(--u)*10); text-align:right; font-style:normal; font-size:calc(var(--u)*3.6); font-variant-numeric:tabular-nums; font-weight:800; text-shadow:0 2px 4px #000; white-space:nowrap; }

  #msg { position:absolute; left:3%; right:3%; bottom:calc(var(--u)*46); text-align:center; font-size:calc(var(--u)*4.2); font-weight:800; line-height:1.35;
    text-shadow:0 2px 0 #000, 0 0 12px rgba(0,0,0,.85); }

  /* 操作パネル */
  #ctl { bottom:0; height:calc(var(--u)*44); background:linear-gradient(180deg,rgba(28,32,38,.0),rgba(28,32,38,.92) 18%, #23272d); }
  .pad { position:absolute; left:calc(var(--u)*4); bottom:calc(var(--u)*4); width:calc(var(--u)*50); height:calc(var(--u)*36); }
  .pad button { position:absolute; width:calc(var(--u)*16.5); height:calc(var(--u)*12.5); border:none; border-radius:calc(var(--u)*3);
    background:linear-gradient(#f4f1ea,#cfc8b8); color:#2b2a26; font-size:calc(var(--u)*7); font-weight:900; line-height:1;
    box-shadow:0 calc(var(--u)*1.2) 0 #77705f, 0 calc(var(--u)*2) calc(var(--u)*3) rgba(0,0,0,.45); }
  .pad button.on { transform:translateY(calc(var(--u)*1)); box-shadow:0 calc(var(--u)*.3) 0 #77705f; background:linear-gradient(#ffe48a,#f2c230); }
  .pad button small { display:block; font-size:calc(var(--u)*2.7); font-weight:700; margin-top:calc(var(--u)*.6); opacity:.75; }
  #bU { left:calc(var(--u)*16.75); top:0; } #bD { left:calc(var(--u)*16.75); bottom:0; }
  #bL { left:0; top:calc(var(--u)*11.75); } #bR { right:0; top:calc(var(--u)*11.75); }
  #act { position:absolute; right:calc(var(--u)*5); bottom:calc(var(--u)*6); width:calc(var(--u)*36); height:calc(var(--u)*32); border:none; border-radius:999px;
    background:radial-gradient(circle at 50% 35%, #ff7a5c, #d8321b 70%); color:#fff; font-size:calc(var(--u)*7.6); font-weight:900; line-height:1.15; letter-spacing:.04em;
    box-shadow:0 calc(var(--u)*1.8) 0 #7d1607, 0 calc(var(--u)*3) calc(var(--u)*4) rgba(0,0,0,.5); text-shadow:0 2px 0 rgba(0,0,0,.35); }
  #act small { display:block; font-size:calc(var(--u)*3.2); font-weight:700; letter-spacing:0; margin-top:calc(var(--u)*.8); opacity:.9; }
  #act.on { transform:translateY(calc(var(--u)*1.4)); box-shadow:0 calc(var(--u)*.4) 0 #7d1607; }
  #act:disabled { filter:grayscale(.9) brightness(.75); }

  /* v2.1：爪の真下の車（狙い）の情報。HUD の下に常時 */
  #hAim { margin-top:calc(var(--u)*1); display:inline-flex; align-items:center; gap:calc(var(--u)*2.2); background:rgba(255,250,236,.94); color:var(--ink);
    border-radius:calc(var(--u)*2.4); padding:calc(var(--u)*1) calc(var(--u)*2.6); font-size:calc(var(--u)*3.7); font-weight:800; white-space:nowrap; box-shadow:0 3px 10px rgba(0,0,0,.3); }
  #hAim .k { color:#6b6455; font-weight:700; }
  #hAim b.tight { color:#d8321b; } #hAim b.mid { color:#c98400; } #hAim b.wide { color:#2f8a3c; }
  #hAim.none { background:rgba(16,20,26,.72); color:var(--cream); }

  /* 中央のバナー・ポップ */
  #banner { position:absolute; left:0; right:0; top:22%; text-align:center; pointer-events:none; opacity:0; transition:opacity .3s; }
  #banner.vis { opacity:1; }
  #banner .r { font-size:calc(var(--u)*5); font-weight:900; letter-spacing:.2em; color:var(--yel); text-shadow:0 2px 0 #000, 0 0 12px rgba(0,0,0,.8); }
  #banner .t { font-size:calc(var(--u)*9); font-weight:900; text-shadow:0 4px 0 #000, 0 0 18px rgba(0,0,0,.8); line-height:1.2; }
  #banner .s { font-size:calc(var(--u)*4.2); font-weight:800; text-shadow:0 2px 0 #000, 0 0 10px rgba(0,0,0,.9); margin-top:calc(var(--u)*1); padding:0 6%; line-height:1.4; }
  #pops { position:absolute; inset:0; pointer-events:none; }
  .pop { position:absolute; left:50%; transform:translate(-50%,0); font-size:calc(var(--u)*5.6); font-weight:900; color:#ffb02e; white-space:nowrap; text-align:center; line-height:1.25;
    text-shadow:0 3px 0 #000, 0 0 12px rgba(0,0,0,.8); animation:popup 2.2s ease-out forwards; background:rgba(12,14,18,.72); border-radius:calc(var(--u)*3); padding:calc(var(--u)*1.2) calc(var(--u)*3.4); }
  .pop small { display:block; font-size:calc(var(--u)*4); color:#fff; }
  .pop.hard { color:#ff5a3a; font-size:calc(var(--u)*7); }
  @keyframes popup { 0% { opacity:0; transform:translate(-50%,20%) scale(.7); } 5% { opacity:1; transform:translate(-50%,0) scale(1.1); } 75% { opacity:1; } 100% { opacity:0; transform:translate(-50%,-110%) scale(1); } }
  #big { position:absolute; left:0; right:0; top:15%; text-align:center; font-size:calc(var(--u)*24); font-weight:900; letter-spacing:.04em; pointer-events:none; display:none;
    color:#fff3a0; text-shadow:0 calc(var(--u)*1.2) 0 #c2410c, 0 calc(var(--u)*2.2) 0 #4a1a04, 0 0 30px rgba(0,0,0,.6); }
  #big.fail { color:#dfe7ef; text-shadow:0 calc(var(--u)*1.2) 0 #39465a, 0 calc(var(--u)*2.2) 0 #10151c, 0 0 30px rgba(0,0,0,.6); font-size:calc(var(--u)*17); }
  #big.vis { display:block; animation:bigin .5s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes bigin { 0% { transform:scale(.2) rotate(-8deg); opacity:0; } 100% { transform:scale(1) rotate(-4deg); opacity:1; } }
  #flash { position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle, rgba(255,220,120,0) 40%, rgba(255,120,40,.45)); opacity:0; }
  /* v2.2：爆発の閃光（白→橙）とシャッターの白 */
  #boom { position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle at 50% 45%, #fffbe8 0%, #ffd27a 35%, rgba(255,110,30,.85) 75%, rgba(120,30,0,.7)); opacity:0; mix-blend-mode:screen; }
  #shutter { position:absolute; inset:0; pointer-events:none; background:#fff; opacity:0; }

  /* v2.2：ポラロイド風の写真（結果カードの上）。v2.3：写真が主役になる大きさ（幅 88%）に */
  #photo { position:relative; width:calc(var(--u)*88); margin:0 auto calc(var(--u)*-2.4); padding:calc(var(--u)*2.4) calc(var(--u)*2.4) 0; background:#fdfcf7;
    border-radius:calc(var(--u)*.6); box-shadow:0 calc(var(--u)*1.6) calc(var(--u)*4) rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.06); transform:rotate(-2deg); z-index:2; display:none; }
  #photo.show { display:block; animation:photoin .55s cubic-bezier(.2,1.4,.4,1) both; }
  #photo.fail { transform:rotate(2deg); }
  #photo.fail.show { animation-name:photoinf; }
  @keyframes photoin { 0% { transform:translateY(-40%) rotate(-14deg) scale(.8); opacity:0; } 100% { transform:rotate(-2deg); opacity:1; } }
  @keyframes photoinf { 0% { transform:translateY(-40%) rotate(14deg) scale(.8); opacity:0; } 100% { transform:rotate(2deg); opacity:1; } }
  #photo .pimg { position:relative; width:100%; aspect-ratio:1/1; background:#1b1d20; overflow:hidden; }
  #photo img { display:block; width:100%; height:100%; object-fit:cover; animation:develop 1.6s ease-out both; }
  @keyframes develop { 0% { filter:brightness(1.9) saturate(0) contrast(.5); } 60% { filter:brightness(1.1) saturate(.8) contrast(.95); } 100% { filter:none; } }
  #photo .tape { position:absolute; left:50%; top:calc(var(--u)*-2.2); width:calc(var(--u)*20); height:calc(var(--u)*4.4); transform:translateX(-50%) rotate(2deg);
    background:rgba(255,236,170,.78); box-shadow:0 1px 2px rgba(0,0,0,.2); }
  #pCap { height:calc(var(--u)*10.5); display:flex; flex-direction:column; justify-content:center; align-items:center; color:#2a2620; line-height:1.2; }
  #pCap b { font-size:calc(var(--u)*5.2); font-weight:900; white-space:nowrap; letter-spacing:.02em; }
  #pCap small { font-size:calc(var(--u)*3.1); font-weight:700; color:#7a7262; white-space:nowrap; margin-top:calc(var(--u)*.4); }
  #photo.fail #pCap b { color:#b3261a; }

  /* カード（1台ごとの結果・タイトル・最終結果） */
  .sheet { background:rgba(255,250,236,.97); color:var(--ink); border-radius:calc(var(--u)*4); padding:calc(var(--u)*4) calc(var(--u)*4.4); box-shadow:0 12px 30px rgba(0,0,0,.5); }
  #card { bottom:3%; padding:0 4%; }
  #card .sheet { text-align:center; }
  /* v2.3：写真つきのカードは文字の板を詰めて、写真に場所を譲る */
  #card.wp .sheet { padding:calc(var(--u)*4.4) calc(var(--u)*4) calc(var(--u)*3.4); border-radius:calc(var(--u)*3.4); }
  #card.wp #cTitle { font-size:calc(var(--u)*6.2); }
  #card.wp #cWhy { font-size:calc(var(--u)*3.4); line-height:1.38; margin:calc(var(--u)*1) 0 calc(var(--u)*1.2); }
  #card.wp #cScore { font-size:calc(var(--u)*3.7); line-height:1.3; }
  #card.wp #cScore b { font-size:calc(var(--u)*8); }
  #card.wp .big { margin-top:calc(var(--u)*2); padding:calc(var(--u)*2.4) calc(var(--u)*10); font-size:calc(var(--u)*5.8); }
  #cTitle { font-size:calc(var(--u)*7.4); font-weight:900; line-height:1.15; }
  #cWhy { font-size:calc(var(--u)*3.7); font-weight:700; line-height:1.45; margin:calc(var(--u)*1.6) 0 calc(var(--u)*2); }
  #cScore { font-size:calc(var(--u)*4.1); font-weight:800; line-height:1.45; }
  #cScore b { font-size:calc(var(--u)*9.5); color:var(--red); font-variant-numeric:tabular-nums; }
  #cScore .st { font-size:calc(var(--u)*3.6); color:#6b6455; margin-top:calc(var(--u)*.4); }
  .big { border:none; border-radius:999px; padding:calc(var(--u)*3) calc(var(--u)*10); font-size:calc(var(--u)*6.4); line-height:1.15; white-space:nowrap; font-weight:900;
    color:#fff; background:linear-gradient(#ff7a5c,#d8321b); box-shadow:0 calc(var(--u)*1.4) 0 #7d1607, 0 calc(var(--u)*2.4) calc(var(--u)*4) rgba(0,0,0,.4); letter-spacing:.06em; margin-top:calc(var(--u)*3); }
  .big:active { transform:translateY(calc(var(--u)*1)); box-shadow:0 calc(var(--u)*.4) 0 #7d1607; }

  #title { top:0; bottom:0; background:linear-gradient(180deg,rgba(10,20,34,.6),rgba(10,20,34,0) 42%,rgba(10,20,34,0) 52%,rgba(10,20,34,.8)); }
  #title .logo { position:absolute; left:0; right:0; top:6%; text-align:center; }
  #title .logo small { display:block; font-size:calc(var(--u)*5); font-weight:900; letter-spacing:.3em; color:var(--yel); text-shadow:0 2px 0 #000; }
  #title .logo h1 { margin:calc(var(--u)*1) 0 0; font-size:calc(var(--u)*12.5); font-weight:900; line-height:1.05; color:#fff; letter-spacing:.02em;
    text-shadow:0 calc(var(--u)*1) 0 #c2410c, 0 calc(var(--u)*2) 0 #4a1a04, 0 0 24px rgba(0,0,0,.5); }
  #title .logo h1 em { font-style:normal; display:inline-block; font-size:.62em; color:var(--yel); margin-top:calc(var(--u)*1); }
  #title .logo p { margin:calc(var(--u)*3) 0 0; font-size:calc(var(--u)*4.3); font-weight:800; text-shadow:0 2px 0 #000, 0 0 10px #000; line-height:1.5; }
  #title .foot { position:absolute; left:0; right:0; bottom:5%; text-align:center; padding:0 5%; }
  #title .how { font-size:calc(var(--u)*3.7); font-weight:700; line-height:1.5; text-shadow:0 2px 0 #000, 0 0 10px #000; }

  #result { top:0; bottom:0; background:rgba(10,16,24,.55); }
  #result .sheet { position:absolute; left:5%; right:5%; top:9%; text-align:center; }
  #rHead { font-size:calc(var(--u)*9); font-weight:900; letter-spacing:.08em; color:#8a6a10; line-height:1.1; }
  #rHead.perfect { color:#d49a00; } #rHead.clear { color:#2f8a3c; } #rHead.over { color:#c0301c; }
  #rSub { font-size:calc(var(--u)*4); font-weight:800; color:#6b6455; margin-top:calc(var(--u)*.6); }
  #rTotal { font-size:calc(var(--u)*15); font-weight:900; color:var(--red); line-height:1.1; font-variant-numeric:tabular-nums; white-space:nowrap; }
  #rTotal small { font-size:calc(var(--u)*5); color:var(--ink); margin-left:.2em; }
  #rRank { font-size:calc(var(--u)*6); font-weight:900; margin:calc(var(--u)*1) 0 calc(var(--u)*3); }
  #rList { width:100%; border-collapse:collapse; font-size:calc(var(--u)*3.9); font-weight:700; }
  #rList td { padding:calc(var(--u)*1.2) calc(var(--u)*.8); border-top:1px solid rgba(0,0,0,.12); white-space:nowrap; }
  #rList td:first-child { text-align:left; } #rList td:last-child { text-align:right; font-variant-numeric:tabular-nums; font-weight:900; }
  #rList .st { font-size:calc(var(--u)*3.3); color:#6b6455; }
  #rList .neg { color:#c0301c; }
  #rList.dense { font-size:calc(var(--u)*3.4); } #rList.dense td { padding:calc(var(--u)*.6) calc(var(--u)*.8); }
</style>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>
  <div id="ui">
    <div id="flash"></div>
    <div id="boom"></div>
    <div id="hud" class="panel">
      <div class="hrow"><div class="chip">残り <b id="hLeft">10</b>台</div><div class="chip">合計 <b id="hScore">0</b>万</div></div>
      <div id="hPrize"><span class="name" id="hName"></span><span class="val" id="hVal"></span><span id="hTries"></span></div>
      <div id="hAimWrap"><div id="hAim"></div></div>
      <div id="hCond"></div>
    </div>

    <div id="gauges" class="panel">
      <div class="g"><span>傾き</span><div class="bar"><i class="fill" id="gTilt"></i><i class="mk" id="mTilt"></i></div><em id="vTilt">0°</em></div>
      <div class="g"><span>揺れ</span><div class="bar"><i class="fill" id="gSwing"></i><i class="mk" id="mSwing"></i></div><em id="vSwing">0°</em></div>
    </div>

    <div id="ctl" class="panel">
      <div id="msg"></div>
      <div class="pad">
        <button id="bU" data-dir="u">▲<small>奥へ</small></button>
        <button id="bL" data-dir="l">◀<small>左へ</small></button>
        <button id="bR" data-dir="r">▶<small>右へ</small></button>
        <button id="bD" data-dir="d">▼<small>手前へ</small></button>
      </div>
      <button id="act">下ろす<small>爪を下ろす</small></button>
    </div>

    <div id="banner"><div class="r" id="bnR"></div><div class="t" id="bnT"></div><div class="s" id="bnS"></div></div>
    <div id="pops"></div>
    <div id="big"></div>

    <div id="card" class="panel">
      <div id="photo"><i class="tape"></i><div class="pimg"><img id="pImg" alt=""></div><div id="pCap"><b id="pCapT"></b><small id="pCapS"></small></div></div>
      <div class="sheet">
        <div id="cTitle"></div>
        <div id="cWhy"></div>
        <div id="cScore"></div>
        <button class="big" id="cBtn">次へ</button>
      </div>
    </div>

    <div id="title" class="panel">
      <div class="logo"><small>REAL SIZE</small><h1>現実版<br>クレーン<br>ゲーム<br><em>駐車場編</em></h1>
        <p><span class="nw">びっしり停まった駐車場から、</span><br><span class="nw">好きな1台を巨大クレーンで釣り上げろ。</span></p></div>

// ------------------------------------------------------------------ 描画同期

// ------------------------------------------------------------------ ループ
var HIRES = false, PAUSED = false;

  if (frameAvg > 40 && curPR > 0.5) next = Math.max(0.5, curPR * 0.8);
  else if (frameAvg < 18 && curPR < maxPR) next = Math.min(maxPR, curPR * 1.15);
  if (next !== curPR) { curPR = next; renderer.setPixelRatio(curPR); renderer.setSize(W, H, false); prCooldown = 1.0; }
}
// v2.6 確認用：描画したフレームごとに、地面の丸い印と爪（の吊り点）の実際の描画位置を記録する
var TRACE = null;
function traceFrame() {

  TRACE.push({ t: performance.now(), phase: state.phase, vis: aim.visible, mx: aim.position.x, mz: aim.position.z, cx: c.x, cz: c.z, onCar: !!under, aimId: state.aimId, cable: state.cable });
}
var clock = new T.Clock();
function frame() {

  var n = Math.max(1, Math.ceil(dt / (1 / 60))), h = dt / n;
  if (!PAUSED) { for (var i = 0; i < n; i++) update(h); sync(dt); renderer.render(scene, camera); if (TRACE) traceFrame(); }
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);

buildLotModels();
L.presentCars(lot).forEach(function (c) { models[c.id].tag.visible = false; });
show('title', true);

// 自動テスト用の読み取り口（ゲーム進行には影響しない）
var _pv = new T.Vector3();
window.__crane = {
  get phase() { return state.phase; },
  info: function () {

    return {
      render: { calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geos: renderer.info.memory.geometries, texs: renderer.info.memory.textures, frameAvg: frameAvg }, carMeshes: (function () { var n = 0; for (var id in models) models[id].body.traverse(function (o) { if (o.isMesh) n++; }); return n; })(),
      seed: SEED, fails: state.fails, left: L.presentCars(lot).length, outcome: gameOutcome(), audio: Sfx.ctx ? Sfx.ctx.state : null, selId: state.aimId, aimId: state.aimId,
      aim: state.aim && (function (a) { var g = L.gaps(lot, a); return { id: a.id, type: a.type.id, x: a.x, z: a.z, com: L.comWorld(a), value: L.carValue(lot, a), gaps: g }; })(state.aim),
      hud: { name: $('hName').textContent, val: $('hVal').style.display === 'none' ? '' : $('hVal').textContent, aim: $('hAimWrap').style.display === 'none' ? '' : $('hAim').textContent },
      crane: { x: cr.x, z: cr.z, vx: cr.vx, vz: cr.vz }, cable: state.cable, claw: { x: e.x, y: e.y, z: e.z }, gripped: state.gripped, stopKind: state.stopKind,
      target: car && { id: car.id, type: car.type.id, x: car.x, z: car.z, com: L.comWorld(car), value: state.rd.value, flip: car.flip },
      clawType: curP() ? curP().id : null,
      cars: lot.cars.map(function (c) { return { id: c.id, type: c.type.id, row: c.row, col: c.col, x: c.x, z: c.z, present: c.present, value: L.carValue(lot, c), damage: c.damage }; }),
      inZone: L.inZone(cr.x, cr.z), swingDeg: L.swingMag(state.swing) / DEG,
      swingAmpDeg: (function () { var s = state.swing, w = lf ? L.swingOmega(car.type, state.cable) : Math.sqrt(9.8 / L.swingLeff(null, state.cable)); return Math.hypot(Math.hypot(s.tx, s.wx / w), Math.hypot(s.tz, s.wz / w)) / DEG; })(),
      load: ld && { e: ld.e.slice(), tiltDeg: Math.hypot(ld.phi[0], ld.phi[1]) / DEG, maxTiltDeg: ld.maxTilt / DEG, maxSwingDeg: ld.maxSwing / DEG, slipping: ld.slipping, detached: ld.detached, cause: ld.cause || null, condition: ld.condition, inSlot: lf.inSlot, bottomY: L.loadBottomY(lf) },
      repairs: state.rd ? state.rd.repairs : 0, contacts: state.rd ? state.rd.log.map(function (ev) { return { source: ev.source, kind: ev.kind, carId: ev.carId, dmg: ev.dmg, repair: ev.repair }; }) : [],
      results: state.results.map(function (r) { return { kind: r.kind, score: r.score, condition: r.condition, repairs: r.repairs, value: r.value }; }),
      total: totalScore(), refTotal: state.refTotal,
      tagsVisible: { present: L.presentCars(lot).length, shown: L.presentCars(lot).filter(function (c) { return models[c.id] && models[c.id].tag && models[c.id].tag.visible; }).length, aimShown: !!(state.aim && models[state.aim.id] && models[state.aim.id].tag && models[state.aim.id].tag.visible), hiddenIds: L.presentCars(lot).filter(function (c) { return !(models[c.id] && models[c.id].tag && models[c.id].tag.visible); }).map(function (c) { return c.id; }) }, decals: Object.keys(models).reduce(function (a, k) { return a + models[k].decals.length; }, 0),

      wrecks: Object.keys(models).filter(function (k) { return models[k].wreck; }).length, debris: debris.length, debrisFlying: debris.filter(function (d) { return !d.rest; }).length,
      fxCount: fx.length, fire: fx.filter(function (f) { return f.kind === 'fire' || f.kind === 'fireball'; }).length, smoke: fx.filter(function (f) { return f.kind === 'smoke'; }).length, shake: state.shake,
      photo: state.photo && { kind: state.photo.kind, len: state.photo.size, ready: !!state.photo.url, ms: state.photo.ms, prof: state.photo.prof, cam: state.photo.cam, boom: state.photo.boom, at: state.photo.at }, boomFx: boomFx(), photoAt: WRECK_PHOTO_AT, photoCount: photoCount,
      preserveDrawingBuffer: renderer.getContext().getContextAttributes().preserveDrawingBuffer,

  },
  /** 車の屋根の中心の画面座標（クライアント座標）。テストが本物のタップを送るため */
  screenPos: function (id) {

  },

  // v2.4 確認用：クレーン構造物（トロリー以外）が駐車場の奥端より手前に出ていないか・半透過の部材が無いか

  cam: function (v) { CAM_OVR = v || null; sync(0); renderer.render(scene, camera); }, // 確認用：[x,y,z, 注視x,y,z] でカメラを固定（null で戻す）

})();
